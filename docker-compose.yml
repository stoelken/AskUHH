services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: askuhh-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: askuhh-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data/docs:/data/docs   # drop PDFs here
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - INDEXER_HOST=${INDEXER_HOST:-http://134.100.39.14:8500}
      - LLM_MODEL=${LLM_MODEL:-qwen3-vl:8b-instruct}
      - TOP_K_IMAGES=${TOP_K_IMAGES:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
